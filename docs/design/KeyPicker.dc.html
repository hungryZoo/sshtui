<div style="height: 24px; display: flex; align-items: center"><div style="flex: 1; height: 1px; background: #3a404b"></div></div>
<div style="display: flex; flex-direction: column; gap: 24px; padding-top: 24px">

<div style="display: flex; height: 24px"><span style="width: 2ch"></span><span style="width: 11ch">Address</span><span style="width: 36ch; box-sizing: border-box; background: #1b1e24; padding: 0 1ch">203.0.113.12</span></div>
<div style="display: flex; height: 24px"><span style="width: 2ch"></span><span style="width: 11ch">Port</span><span style="width: 36ch; height: 24px; box-sizing: border-box; background: #1b1e24"></span></div>
<div style="display: flex; height: 24px"><span style="width: 2ch">›</span><span style="width: 11ch">Key file</span><span style="width: 36ch; height: 24px; box-sizing: border-box; background: #1b1e24"></span></div>

<div style="flex: 1"></div>
<div style="height: 24px; display: flex; align-items: center"><div style="flex: 1; height: 1px; background: #3a404b"></div></div>
<div style="display: flex; gap: 3ch; height: 24px">

<div style="display: flex; gap: 1ch"><span style="font-weight: 700; color: #d8dbe1">↑↓</span><span>select</span></div>
<div style="display: flex; gap: 1ch"><span style="font-weight: 700; color: #d8dbe1">esc</span><span>cancel</span></div>
</div>
<div style="position: absolute; left: 50%; top: 188px; transform: translateX(-50%); width: 60ch; box-sizing: border-box; background: #15171c; border: 1px solid #d8dbe1; padding: 12px 2ch; color: #d8dbe1; display: flex; flex-direction: column">
